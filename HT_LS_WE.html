<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>智慧随访中心｜高血压-低具体-我们 V4</title>
<style>
  :root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#7b8794;
    --line:#e7ecf2;
    --brand:#2f6fed;
    --brand-soft:#edf3ff;
    --user:#2f6fed;
    --bot:#ffffff;
    --shadow:0 14px 40px rgba(31,41,55,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#e9eef5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--text)}
  body{display:flex;justify-content:center;align-items:center;padding:18px}
  .phone{
    width:min(430px,100%);
    height:min(820px,94vh);
    background:var(--bg);
    border-radius:32px;
    overflow:hidden;
    box-shadow:var(--shadow);
    border:1px solid rgba(31,41,55,.08);
    display:flex;
    flex-direction:column;
  }
  .status{
    height:34px;background:#fff;display:flex;align-items:center;justify-content:space-between;
    padding:8px 18px 4px;font-size:12px;font-weight:600;color:#111827;flex:none;
  }
  .status .icons{letter-spacing:2px;font-size:11px}
  .topbar{
    height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;flex:none;
  }
  .topbar .title{text-align:center;line-height:1.1}
  .topbar .title strong{display:block;font-size:17px}
  .topbar .title span{display:block;font-size:11px;color:var(--muted);margin-top:4px;font-weight:500}
  .topbar .back{position:absolute;left:16px;color:#394150;font-size:22px;opacity:.55}
  .topbar .more{position:absolute;right:16px;color:#394150;font-size:22px}
  .screen{display:none;flex:1;min-height:0}
  .screen.active{display:flex}
  #scenario{flex-direction:column;padding:22px;background:linear-gradient(180deg,#f7faff 0%,#f4f7fb 100%)}
  .scenario-card{
    background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px 22px;box-shadow:0 10px 24px rgba(31,41,55,.06);margin-top:26px;
  }
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:700;padding:7px 10px;border-radius:999px;margin-bottom:16px}
  .scenario-card h1{font-size:24px;margin:0 0 14px;letter-spacing:-.3px}
  .scenario-card p{font-size:15px;line-height:1.85;margin:0;color:#3d4856}
  .scenario-card .tip{margin-top:18px;padding:13px 14px;background:#f7f9fc;border-radius:14px;font-size:12px;color:#677385;line-height:1.7}
  .primary{
    margin-top:auto;width:100%;border:0;border-radius:16px;background:var(--brand);color:#fff;font-weight:700;font-size:16px;padding:15px 18px;cursor:pointer;box-shadow:0 8px 20px rgba(47,111,237,.25)
  }
  .primary:active{transform:scale(.99)}
  #chat{flex-direction:column;min-height:0;background:var(--bg)}
  .chat-scroll{flex:1;overflow-y:auto;padding:18px 14px 12px;scroll-behavior:smooth}
  .day{text-align:center;color:#99a3b0;font-size:11px;margin:4px 0 16px}
  .row{display:flex;align-items:flex-end;gap:8px;margin:12px 0;animation:fadeUp .3s ease both}
  .row.user{justify-content:flex-end}
  .avatar{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#4b7df0,#6ea1ff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex:none;box-shadow:0 4px 10px rgba(47,111,237,.18)}
  .bubble{max-width:78%;padding:11px 13px;border-radius:16px;font-size:14px;line-height:1.62;box-shadow:0 4px 12px rgba(31,41,55,.05);white-space:pre-line}
  .bot .bubble{background:var(--bot);border:1px solid #edf0f4;border-bottom-left-radius:5px}
  .user .bubble{background:var(--user);color:#fff;border-bottom-right-radius:5px;box-shadow:0 5px 12px rgba(47,111,237,.18)}
  .typing{display:flex;gap:4px;align-items:center;height:21px}
  .typing i{display:block;width:6px;height:6px;background:#aab3bf;border-radius:50%;animation:bounce 1s infinite ease-in-out}
  .typing i:nth-child(2){animation-delay:.14s}.typing i:nth-child(3){animation-delay:.28s}
  .options{flex:none;background:#fff;border-top:1px solid var(--line);padding:11px 12px calc(11px + env(safe-area-inset-bottom));display:grid;gap:9px}
  .option-btn{border:1px solid #dfe5ed;background:#fff;color:#263241;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  .option-btn:hover{background:#f7faff;border-color:#cbd8f5}
  .option-btn:active{transform:scale(.99)}
  .option-btn.action{background:var(--brand);border-color:var(--brand);color:#fff}
  .option-btn.secondary{background:#f7f9fc}
  .advice-row{align-items:flex-start}
  .advice-wrap{max-width:84%;min-width:0}
  .advice-card{background:#fff;border:1px solid #dfe7f3;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(31,41,55,.07)}
  .advice-head{padding:14px 15px 12px;background:linear-gradient(180deg,#f8fbff 0%,#f2f6ff 100%);border-bottom:1px solid #e8eef8}
  .advice-kicker{font-size:11px;color:#70809a;margin-bottom:4px;font-weight:600}
  .advice-title{font-size:16px;font-weight:800;color:#22314a;letter-spacing:.1px}
  .advice-body{padding:4px 14px 6px}
  .advice-text{padding:15px 15px 16px;font-size:13.5px;line-height:1.75;color:#425066;white-space:normal;text-align:left}
  .advice-text p{margin:0 0 10px 0}
  .advice-text p:last-child{margin-bottom:0}
  .advice-item{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #edf1f6;opacity:0;transform:translateY(7px);transition:opacity .32s ease,transform .32s ease}
  .advice-item.show{opacity:1;transform:none}
  .advice-item:last-of-type{border-bottom:0}
  .advice-num{width:25px;height:25px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none;margin-top:1px}
  .advice-copy{min-width:0}
  .advice-copy strong{display:block;font-size:13px;color:#2d3a4d;margin-bottom:4px}
  .advice-copy span{display:block;font-size:13px;line-height:1.65;color:#4b5767}
  .advice-follow{margin:5px 14px 14px;padding:11px 12px;background:#f7f9fc;border-radius:12px;font-size:12.5px;line-height:1.7;color:#526071;opacity:0;transform:translateY(6px);transition:opacity .32s ease,transform .32s ease}
  .advice-follow.show{opacity:1;transform:none}
  .action-note{font-size:11px;color:#8b96a5;text-align:center;padding:0 4px 2px}
  #done{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px;background:#fff}
  .done-icon{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#edf3ff;color:var(--brand);font-size:34px;margin-bottom:18px}
  #done h2{margin:0 0 10px;font-size:23px}
  #done p{margin:0;color:#667281;line-height:1.75;font-size:14px}
  .done-actions{width:100%;margin-top:28px;display:grid;gap:10px}
  .outline{width:100%;border:1px solid #dfe5ed;border-radius:14px;background:#fff;padding:12px;font-weight:600;color:#4b5563;cursor:pointer}
  .debug{display:none;margin-top:18px;width:100%;text-align:left;background:#f7f9fc;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12px;color:#556171;white-space:pre-wrap}
  .footnote{font-size:10px;color:#9ba4af;text-align:center;margin-top:12px}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-4px);opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @media(max-width:480px){body{padding:0}.phone{width:100%;height:100vh;border-radius:0;border:0}.scenario-card{margin-top:18px}}
</style>
</head>
<body>
<!-- CONDITION: HT_LS_WE | 高血压 | 低具体 | 我们 -->

<div class="phone">
  <div class="status"><span>19:41</span><span class="icons">● ◔ ▰</span></div>
  <div class="topbar">
    <span class="back">‹</span>
    <div class="title"><strong>智慧随访中心</strong><span>AI随访助手</span></div>
    <span class="more">⋯</span>
  </div>

  <section id="chat" class="screen active">
    <div class="chat-scroll" id="chatScroll">
      <div class="day">今天 19:41</div>
      <div class="row bot" id="welcomeRow">
        <div class="avatar">✦</div>
        <div class="bubble">这里是智慧随访中心AI随访助手。接下来将进行一次简短随访，并提供后续健康管理建议。整个过程大约需要1—2分钟。</div>
      </div>
    </div>
    <div class="options" id="options">
      <button class="option-btn action" id="beginFollowupBtn">开始随访</button>
    </div>
  </section>

  <section id="done" class="screen">
    <div class="done-icon">✓</div>
    <h2 id="doneTitle">本次随访已完成</h2>
    <p id="doneText">感谢完成本次模拟AI诊后随访。正式实验中，此处可自动跳转到操纵检验与后续量表。</p>
    <div class="done-actions">
      <button class="primary" id="restartBtn">重新体验原型</button>
      <button class="outline" id="logBtn">查看本次原型记录</button>
    </div>
    <div id="debug" class="debug"></div>
    <div class="footnote">原型条件：肥胖 × 高信息具体性 × 第一人称复数“我们”</div>
  </section>
</div>

<script>
  const state = {
    condition: 'obesity_ht_ls_we',
    startedAt: null,
    q1: null,
    q2: null,
    actionCard: null,
    adviceFullyShownAt: null,
    actionPromptShownAt: null,
    events: []
  };

  const chat = document.getElementById('chat');
  const done = document.getElementById('done');
  const chatScroll = document.getElementById('chatScroll');
  const options = document.getElementById('options');
  const debug = document.getElementById('debug');

  function logEvent(type, value=''){
    state.events.push({type, value, time: new Date().toISOString()});
  }

  function scrollBottom(){
    requestAnimationFrame(() => chatScroll.scrollTop = chatScroll.scrollHeight);
  }

  function addBot(text){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.innerHTML = `<div class="avatar">✦</div><div class="bubble"></div>`;
    row.querySelector('.bubble').textContent = text;
    chatScroll.appendChild(row);
    scrollBottom();
  }

  function addUser(text){
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `<div class="bubble"></div>`;
    row.querySelector('.bubble').textContent = text;
    chatScroll.appendChild(row);
    scrollBottom();
  }

  function showTyping(ms=720){
    return new Promise(resolve => {
      const row = document.createElement('div');
      row.className = 'row bot';
      row.id = 'typingRow';
      row.innerHTML = `<div class="avatar">✦</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>`;
      chatScroll.appendChild(row);
      scrollBottom();
      setTimeout(() => { row.remove(); resolve(); }, ms);
    });
  }

  function delay(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function addAdviceCard(){
    const row = document.createElement('div');
    row.className = 'row bot advice-row';
    row.innerHTML = `
      <div class="avatar">✦</div>
      <div class="advice-wrap">
        <div class="advice-card">
          <div class="advice-head">
            <div class="advice-title">本次健康管理建议</div>
          </div>
          <div class="advice-text">
            <p>接下来，我们可以先把后续健康管理安排清楚。</p>
            <p>我们可以继续关注饮食、运动、用药以及身体指标记录。</p>
            <p>近期请继续关注血压或相关身体指标。</p>
            <p>之后请保持饮食、运动或用药管理安排。</p>
            <p>后续请在AI随访系统中反馈整体健康情况。</p>
            <p>持续完成这些管理事项，有助于帮助疾病保持稳定。</p>
          </div>
        </div>
      </div>`;
    chatScroll.appendChild(row);
    scrollBottom();

    state.adviceFullyShownAt = new Date().toISOString();
    logEvent('stimulus_fully_shown', 'ht_ls_we');
  }

  function setOptions(items){
    options.innerHTML = '';
    items.forEach(item => {
      const b = document.createElement('button');
      b.className = 'option-btn ' + (item.kind || '');
      b.textContent = item.label;
      b.onclick = () => item.onClick(item.label);
      options.appendChild(b);
    });
  }

  function disableOptions(){
    options.querySelectorAll('button').forEach(b => b.disabled = true);
  }

  async function openChat(){
    if(state.startedAt) return;
    state.startedAt = new Date().toISOString();
    logEvent('start');
    chat.classList.add('active');
    options.innerHTML = '';
    await showTyping(650);
    askQ1();
  }

  function askQ1(){
    addBot('最近一周，整体身体状态如何？');
    setOptions([
      {label:'较好', onClick:answerQ1},
      {label:'一般', onClick:answerQ1},
      {label:'不太好', onClick:answerQ1}
    ]);
  }

  async function answerQ1(label){
    disableOptions();
    state.q1 = label;
    logEvent('q1', label);
    addUser(label);
    options.innerHTML = '';
    await showTyping(560);
    addBot('好的，已记录。');
    await showTyping(620);
    addBot('最近一周，按照医生建议进行日常健康管理的情况如何？');
    setOptions([
      {label:'基本能够做到', onClick:answerQ2},
      {label:'偶尔没有做到', onClick:answerQ2},
      {label:'执行起来有些困难', onClick:answerQ2}
    ]);
  }

  async function answerQ2(label){
    disableOptions();
    state.q2 = label;
    logEvent('q2', label);
    addUser(label);
    options.innerHTML = '';

    await showTyping(600);
    addBot('好的，本次随访信息已记录完成。');
    await delay(520);
    addBot('正在整理本次随访建议…');
    await showTyping(980);

    await addAdviceCard();
    logEvent('stimulus_shown', 'ht_ls_we');

    // 给完整建议留出独立阅读时间，不显示倒计时或下一步按钮。
    await delay(3400);
    await showTyping(650);
    addBot('以上是本次随访建议。为方便之后查看，可以将本次建议保存为一张行动卡。');
    await delay(900);

    state.actionPromptShownAt = new Date().toISOString();
    logEvent('action_prompt_shown');
    setOptions([
      {label:'领取行动卡', kind:'action', onClick:chooseAction},
      {label:'暂不领取', kind:'secondary', onClick:chooseAction}
    ]);
  }

  async function chooseAction(label){
    disableOptions();
    state.actionCard = label === '领取行动卡' ? 1 : 0;
    const readMs = state.adviceFullyShownAt ? Date.now() - new Date(state.adviceFullyShownAt).getTime() : null;
    logEvent('action_card', {choice: state.actionCard, ms_since_advice_full: readMs});
    addUser(label);
    options.innerHTML = '';
    await showTyping(560);
    if(state.actionCard === 1){
      addBot('已记录本次选择。');
    }else{
      addBot('好的，已记录本次选择。');
    }
    await new Promise(r => setTimeout(r, 650));
    chat.classList.remove('active');
    done.classList.add('active');
    localStorage.setItem('aiFollowupPrototypeLog', JSON.stringify(state));
  }

  function resetPrototype(){
    state.startedAt = null; state.q1 = null; state.q2 = null; state.actionCard = null; state.adviceFullyShownAt = null; state.actionPromptShownAt = null; state.events = [];
    chatScroll.innerHTML = `<div class="day">今天 19:41</div>
      <div class="row bot" id="welcomeRow">
        <div class="avatar">✦</div>
        <div class="bubble">这里是智慧随访中心AI随访助手。接下来将进行一次简短随访，并提供后续健康管理建议。整个过程大约需要1—2分钟。</div>
      </div>`;
    options.innerHTML = '<button class="option-btn action" id="beginFollowupBtn">开始随访</button>';
    debug.style.display = 'none';
    done.classList.remove('active');
    chat.classList.add('active');
    document.getElementById('beginFollowupBtn').onclick = openChat;
  }

  // 点击后启动，兼容本地文件、嵌入预览及常见手机浏览器
  document.getElementById('beginFollowupBtn').onclick = openChat;
  document.getElementById('restartBtn').onclick = resetPrototype;
  document.getElementById('logBtn').onclick = () => {
    const saved = localStorage.getItem('aiFollowupPrototypeLog');
    debug.textContent = saved ? JSON.stringify(JSON.parse(saved), null, 2) : '暂无记录';
    debug.style.display = debug.style.display === 'block' ? 'none' : 'block';
  };
</script>
</body>
</html>
